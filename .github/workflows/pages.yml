name: Deploy static notebook

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Cache-bust own JS/CSS assets
        env:
          SHA: ${{ github.sha }}
        run: |
          grep -rlE '(href|src)="[^"]*(styles\.css|main\.js|translations\.js|notes-lang\.js)"' --include="*.html" . | while read -r f; do
            sed -i -E "s#(href|src)=\"([^\"]*(styles\.css|main\.js|translations\.js|notes-lang\.js))\"#\1=\"\2?v=${SHA}\"#g" "$f"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
